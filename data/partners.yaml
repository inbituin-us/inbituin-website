# In Bituin — Constellation Map partner businesses
#
# To add a spot: copy an existing block (from "- id:" through "accent:"),
# paste below, and fill in the fields.
#
# id          — short slug, lowercase, no spaces (e.g. "kabisera")
# name        — business name shown on the map
# type        — Restaurant | Café | Bakery | Bar | Boutique | Shop (used for filters)
# neighborhood — area label, e.g. "Williamsburg · Brooklyn"
# address     — full street address
# lat / lng   — map coordinates (Google Maps → right-click → copy lat/lng)
# logo        — public image path, e.g. "/assets/partner-logos/kabisera.png"
# logoPlacement — top | bottom (where the logo sits relative to the star)
# logoGapDesktop / logoGapMobile — px gap between logo and star; negative values overlap closer
# mapsUrl     — optional direct map/directions URL
# perk        — short perk line on the list card
# perkLong    — full perk text in the detail view
# start / end — optional perk dates shown to users, e.g. "Jun 13" / "Jun 20"
# desc        — one or two sentence description
# accent      — hex color for badges and highlights

